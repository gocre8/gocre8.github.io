<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How light changes your colors</title>
<meta name="theme-color" content="#f4f6f9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;1,300&family=Courier+Prime:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --white: #ffffff;
  --bg: #f4f6f9;
  --surface-alt: #eff1f4;
  --ink: #222222;
  --ink-soft: #666666;
  --ink-ghost: #aaaaaa;
  --line: #eaeaea;
  --border: #e0e3e8;
  --border-soft: #eceef2;
  --accent: #2a4a82;
  --accent-pale: #e5ecf7;
  --ok: #1a5c2a;
  --err: #8a1010;
  --warn: #8a5a10;
  --radius: 3px;
  --ui: 'Jost', system-ui, sans-serif;
  --num: 'Courier Prime', ui-monospace, monospace;
}
* { box-sizing: border-box; }
/* Full-screen home-screen app: keep content out from under the notch and home bar (0 everywhere else). */
body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ui); font-weight: 300; font-size: 15px; line-height: 1.45; }
#app { max-width: 1100px; margin: 0 auto; padding: 12px; }
h2 { font-size: 1.05rem; font-weight: 400; margin: 0 0 6px; }
.label { font-size: 9px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-soft); margin: 0 0 6px; }
.num { font-family: var(--num); font-size: 0.8rem; color: var(--ink-soft); }
.muted { color: var(--ink-soft); font-size: 0.85rem; }
.panel { background: var(--white); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; }

/* steps */
.steps { display: flex; gap: 6px; margin-bottom: 10px; }
.steps button { flex: 1; }
.step-dot { display: inline-block; width: 18px; height: 18px; line-height: 18px; border-radius: 50%; background: var(--ink-ghost); color: var(--white); font-size: 11px; text-align: center; margin-right: 6px; font-family: var(--num); }
.steps .on .step-dot { background: var(--ink); }

/* buttons and inputs */
button, .btn { font-family: var(--ui); font-weight: 300; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; border-radius: var(--radius); border: 1px solid var(--border); background: var(--white); color: var(--ink); padding: 10px 12px; min-height: 44px; cursor: pointer; }
button.primary, .btn.primary { background: var(--ink); color: var(--white); border-color: var(--ink); }
button.on { background: var(--accent-pale); border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: 0.45; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row > * { flex: 0 0 auto; }
select, input[type=text], input[type=number] { font-family: var(--ui); font-weight: 300; font-size: 15px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-alt); color: var(--ink); padding: 8px; min-height: 44px; max-width: 100%; }
input[type=number] { font-family: var(--num); width: 5.2em; }
label.field { display: block; margin: 8px 0; }
label.field > span { display: block; font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-soft); margin-bottom: 3px; font-weight: 400; }
.upload input[type=file] { display: none; }

/* thumbnails */
.thumbs { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; }
.thumbs button { padding: 0; width: 64px; height: 64px; overflow: hidden; }
.thumbs button img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumbs button.on { outline: 2px solid var(--ink); }

/* workspace */
.work { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.work > * { min-width: 0; } /* a zoomed canvas must scroll inside the stage, not widen the column */
@media (min-width: 900px) { .work { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); } }
.toolbar { background: var(--surface-alt); border-radius: var(--radius); padding: 6px; display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.stage { position: relative; overflow: auto; max-height: 70vh; background: var(--surface-alt); border-radius: var(--radius); }
.stage canvas.view { display: block; touch-action: none; cursor: crosshair; }
.loupe { position: absolute; pointer-events: none; width: 120px; height: 120px; border-radius: 50%; border: 2px solid var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.25); display: none; background: var(--white); }
.hint { font-size: 0.85rem; color: var(--ink-soft); margin: 4px 0; }

/* chips and readouts */
.chip { display: inline-block; width: 28px; height: 28px; border-radius: var(--radius); border: 1px solid var(--border); vertical-align: middle; }
.chips { display: flex; gap: 6px; align-items: center; }
.readout { font-family: var(--num); font-size: 0.85rem; }
.readout .main { color: var(--ink); font-size: 0.95rem; }
.readout .sub { color: var(--ink-soft); }

/* results */
.verdict { font-size: 1.15rem; font-weight: 400; margin: 2px 0 8px; }
.level-ok { color: var(--ok); }
.level-little { color: var(--warn); }
.level-lot { color: var(--err); }
.swatch-row { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
.swatch-row:first-child { border-top: none; }
.swatch-row .text { flex: 1; min-width: 0; }
.swatch-row .text .head { font-weight: 400; }
.tag { display: inline-block; font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; padding: 2px 6px; border-radius: var(--radius); background: var(--surface-alt); color: var(--ink-soft); margin-left: 4px; }
.tag.best { background: var(--accent-pale); color: var(--accent); }
.lx-link { display: grid; gap: 2px; text-decoration: none; color: var(--ink); min-height: 44px; }
.lx-link b { font-weight: 400; color: var(--accent); }
.lx-link:hover b { text-decoration: underline; }
details.more { background: var(--white); border: 1px solid var(--border-soft); border-radius: var(--radius); margin-bottom: 8px; }
details.more > summary { cursor: pointer; padding: 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; list-style: none; min-height: 44px; }
details.more > summary::before { content: '▸ '; }
details.more[open] > summary::before { content: '▾ '; }
details.more > .body { padding: 0 12px 12px; }
table.data { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
table.data th { text-align: left; font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-soft); font-weight: 400; padding: 4px; border-bottom: 1px solid var(--line); }
table.data td { padding: 4px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.data td.n { font-family: var(--num); }
.scroll-x { overflow-x: auto; }
.corner-map { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; max-width: 260px; }
.corner-map div { background: var(--surface-alt); border-radius: var(--radius); padding: 6px; font-family: var(--num); font-size: 0.8rem; }
.error-msg { color: var(--err); font-size: 0.85rem; }
.preview canvas { max-width: 100%; display: block; border-radius: var(--radius); touch-action: pan-y; }

@media (max-width: 680px) {
  #app { padding: 8px; }
  .steps button { padding: 8px 4px; font-size: 10px; }
}

/* Step 1 example: same paint, six lights */
#lightsExample .label { margin-top: 18px; }
.lx-chart { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px; align-items: start; margin-top: 8px; max-width: 620px; }
.lx-chart img { width: 100%; display: block; border-radius: var(--radius); }
.lx-key { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 0.85rem; }
.lx-key li { display: flex; align-items: center; gap: 8px; }
.lx-num { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--ink); font-size: 0.7rem; font-weight: 600; flex: none; margin-right: 4px; }
.lx-chip { display: block; width: 56px; height: 34px; border-radius: 2px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.lx-chip.sm { width: 30px; height: 20px; }
.lx-chip.truth { outline: 2px solid var(--ink); outline-offset: 2px; }
.lx-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.lx-photo { margin: 0; font-size: 0.85rem; line-height: 1.35; min-width: 0; }
.lx-photo img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; border-radius: var(--radius); margin-bottom: 6px; }
.lx-tag { display: inline-block; font-size: 0.72rem; padding: 1px 7px; border: 1px solid currentColor; border-radius: 999px; margin: 4px 0; }
.lx-tag.ok, .lx-d.ok { color: var(--ok); } .lx-tag.warn, .lx-d.warn { color: var(--warn); } .lx-tag.err, .lx-d.err { color: var(--err); }
.lx-gb { list-style: none; margin: 4px 0 0; padding: 0; }
.lx-gb li { padding-left: 14px; position: relative; }
.lx-gb li::before { position: absolute; left: 0; font-weight: 600; }
.lx-gb li.g::before { content: '+'; color: var(--ok); } .lx-gb li.b::before { content: '–'; color: var(--err); }
.lx-grid { border-collapse: separate; border-spacing: 5px; min-width: 640px; margin-top: 8px; }
.lx-grid th { font-size: 0.72rem; font-weight: 400; color: var(--ink-soft); text-align: left; vertical-align: bottom; }
.lx-grid th.lx-row { color: var(--ink); white-space: nowrap; vertical-align: middle; font-size: 0.8rem; }
.lx-d { display: block; font-size: 0.75rem; margin-top: 2px; }
@media (max-width: 560px) { .lx-chart { grid-template-columns: 1fr; } }
label.check { display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: 0.9rem; cursor: pointer; }
label.check input { width: 20px; height: 20px; margin: 0; }

</style>
</head>

  const FIX = { yes: ['Fixable', 'ok'], mostly: ['Mostly fixable', 'warn'], partly: ['Partly fixable', 'warn'], no: ['Not fixable', 'err'] };
  const SW = [['paper', 'Paper', 'P'], ['yellow tip', 'Yellow', '1'], ['light green', 'Light green', '2'], ['teal band', 'Dark teal', '3'],
    ['blue corner', 'Blue', '4'], ['violet band', 'Violet', '5'], ['magenta', 'Magenta', '6'], ['red corner', 'Red', '7'], ['orange band', 'Orange', '8']];
  const dot = d => (d < 5 ? 'ok' : d < 10 ? 'warn' : 'err');
  let mode = 'raw';
  const PAGE = 'mix-feedback-lights.html';

  function intro() {
    return `<p class="hint">One painted chart, photographed six times with an iPhone. The paint is the same in every photo. Only the light changed.
      Each numbered spot was measured with a color meter, so we know its real color.</p>`;
  }

  function body() {
    const { T, crops, labeled } = MF_lightsData;
    const key = SW.map(([k, n, num]) => `<li><span class="lx-num">${num}</span><span class="lx-chip sm" style="background:${T.true[k].hex}"></span>${n}</li>`).join('');
    const photos = LIGHTS.map(L => {
      const st = T[L.k].stats, f = FIX[L.fix];
      return `<figure class="lx-photo"><img src="${crops[L.k]}" alt="The test chart photographed in ${L.name.toLowerCase()}" loading="lazy">
        <figcaption><b>${L.name}</b> <span class="muted">${L.sub}</span><br>
        <span class="lx-tag ${f[1]}">${f[0]}</span> <span class="num">${st.raw[0].toFixed(0)} off as shot, ${st.card[0].toFixed(0)} after the fix</span>
        <ul class="lx-gb">${L.good.map(g => `<li class="g">${g}</li>`).join('')}${L.bad.map(g => `<li class="b">${g}</li>`).join('')}</ul></figcaption></figure>`;
    }).join('');
    return `${intro()}
      <div class="lx-chart"><img src="${labeled}" alt="The test chart with nine numbered spots: P is the paper, 1 to 8 are painted swatches"><ul class="lx-key">${key}</ul></div>
      <div class="label">The six photos</div>
      <div class="lx-photos">${photos}</div>
      <div class="label">How far off?</div>
      <p class="hint">0 to 3: hard to see a difference. 5: looks like a different mix. 10: looks like a different color. 20: not even close.</p>
      <div class="label">Real paint vs. the photo</div>
      <div class="row"><button data-lx="raw" class="${mode === 'raw' ? 'on' : ''}">As photographed</button><button data-lx="fix" class="${mode === 'fix' ? 'on' : ''}">After the app corrects it</button></div>
      <div class="scroll-x"><table class="lx-grid" id="lxGrid">${grid()}</table></div>
      <div class="label">So which light is best?</div>
      <p><b>Best for color:</b> window light or outdoor shade, out of direct sun. Both came out a little dark, but after the app corrects them they were the closest to the real paint, about 4 off.</p>
      <p><b>Can be fixed:</b> daylight photos fix well. A cool desk lamp at night also fixed fairly well.</p>
      <p><b>Can't be fixed:</b> glare from direct sun, and light that is very uneven across the page. Warm lamps only partly fix, because the blue was never recorded.</p>`;
  }

  function grid() {
    const { T } = MF_lightsData;
    const head = `<tr><th></th><th>Real paint</th>${LIGHTS.map(L => `<th>${L.name}</th>`).join('')}</tr>`;
    return head + SW.map(([k, n, num]) => `<tr><th class="lx-row"><span class="lx-num">${num}</span>${n}</th><td><span class="lx-chip truth" style="background:${T.true[k].hex}"></span></td>` +
      LIGHTS.map(L => {
        const s = T[L.k].sw[k], d = mode === 'raw' ? s.deRaw : s.deFix;
        return `<td><span class="lx-chip" style="background:${mode === 'raw' ? s.raw : s.fix}"></span><span class="num lx-d ${dot(d)}">${d.toFixed(0)}</span></td>`;
      }).join('') + '</tr>').join('');
  }

  // Its own page (mix-feedback-lights.html), so the photos never load with the app.
  function mount(el) {
    el.innerHTML = body();
    el.querySelectorAll('[data-lx]').forEach(btn => btn.addEventListener('click', () => {
      mode = btn.dataset.lx;
      el.querySelector('#lxGrid').innerHTML = grid();
      el.querySelectorAll('[data-lx]').forEach(x => x.classList.toggle('on', x.dataset.lx === mode));
    }));
  }

  // In the app: only a link to that page.
  function html() {
    return `<a class="panel lx-link" id="lightsExample" href="${PAGE}" target="_blank" rel="noopener">
      <span class="label">Before you shoot</span><b>How light changes your colors: a real example</b>
      <span class="muted">One chart, six lights, real meter readings. Opens in a new tab.</span></a>`;
  }

  return { html, mount, LIGHTS, PAGE };
})();
if (typeof module !== 'undefined') module.exports = MF_lights;

</script>
<script>MF_lights.mount(document.getElementById('lights'));</script>
</body>
</html>
