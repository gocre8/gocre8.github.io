    for (const c of cardTaps) dot(ctx, c.x * w, c.y * h, 6, '#2a4a82');
    if (photo.card) {
      ctx.strokeStyle = 'rgba(42,74,130,.8)'; ctx.lineWidth = 1.5; ctx.beginPath();
      photo.card.corners.forEach((c, i) => (i ? ctx.lineTo : ctx.moveTo).call(ctx, c.x * w, c.y * h));
      ctx.closePath(); ctx.stroke();
    }
    photo.corners.forEach((c, i) => marker(ctx, c.x * w, c.y * h, 'U' + (i + 1), 'circle', A.app.selected === 'U' + i, 'rgba(255,255,255,.85)'));
    for (const pin of photo.pins) {
      const fill = pin.role === 'known' ? '#2a4a82' : pin.role === 'goal' ? '#222' : '#666';
      marker(ctx, pin.x * w, pin.y * h, pin.label, 'pin', A.app.selected === pin.id, fill);
    }
    marker(ctx, photo.paperPin.x * w, photo.paperPin.y * h, 'W', 'square', A.app.selected === 'paper', '#fff');
  }
  function label(ctx, text, x, y) {
    ctx.font = '400 11px Jost, sans-serif';
    const tw = ctx.measureText(text).width;
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillRect(x - 3, y - 11, tw + 6, 15);
    ctx.fillStyle = '#222'; ctx.fillText(text, x, y);
  }
  function dot(ctx, x, y, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
  function marker(ctx, x, y, text, shape, selected, fill) {
    const r = selected ? 11 : 9;
    ctx.lineWidth = selected ? 3 : 2;
    ctx.strokeStyle = shape === 'square' || shape === 'circle' ? '#222' : '#fff';
    ctx.fillStyle = fill;
    ctx.beginPath();
    if (shape === 'square') ctx.rect(x - r, y - r, 2 * r, 2 * r); else ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = shape === 'pin' ? '#fff' : '#222'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x - 3, y); ctx.lineTo(x + 3, y); ctx.moveTo(x, y - 3); ctx.lineTo(x, y + 3); ctx.stroke();
    if (shape === 'square') { ctx.fillStyle = '#222'; ctx.font = '400 11px Jost, sans-serif'; ctx.fillText('W', x - 5, y - r - 4); return; }
    ctx.font = '400 11px Jost, sans-serif';
    const tw = ctx.measureText(text).width;
    const cssW = parseFloat(canvas.style.width) || canvas.width;
    // Near the right edge, put the label on the left so it stays on the photo.
    label(ctx, text, x + r + 4 + tw + 6 > cssW ? x - r - 4 - tw : x + r + 4, y + 4);
  }

  return { html, bind, draw, refreshPanel };
})();

</script>
<script>
/* ---- ui_pins.js ---- */
// Step 2 side panel: the selected pin's numbers, role, known value, goal and painting group.
const MF_pins = (() => {
  const A = MF_app, C = MF_color, St = MF_state, D = MF_data;
  const ROLE_NAMES = { goal: 'Check my mix', known: 'Color I measured', look: 'Just show the color' };
  const ROLE_HELP = {
    goal: 'Compares this swatch with its goal color and tells you what to add.',
    known: 'You have meter numbers for this swatch. The app uses it to correct the photo. No mix feedback.',
    look: 'Shows the color under the pin. No feedback.',
  };

  function selectedPin(photo) { return photo.pins.find(p => p.id === A.app.selected) || null; }

  function html() {
    const photo = A.activePhoto(), r = A.result(), sel = A.app.selected;
    if (!r) return '';
    const correction = `<p class="muted">Correction: ${r.correction.method === 'matrix' ? 'paper and known colors' : 'paper only'}. Photo error about ${r.correction.error.toFixed(1)} ΔE00.</p>`;
    if (sel === 'paper') {
      return `<section class="panel"><div class="label">W · Paper pin</div>
        <p>Raw paper in this photo:</p>${A.readout(r.rawPaperLab, r.rawPaperRgb)}
        <p>Measured class paper:</p>${A.readout(r.truePaper)}${correction}</section>`;
    }
    if (sel && sel[0] === 'U' && sel.length === 2) {
      const i = Number(sel[1]), s = MF_sampler.samplePatch(A.app.images[photo.id].img,
        photo.corners[i].x * A.app.images[photo.id].img.width, photo.corners[i].y * A.app.images[photo.id].img.height, photo.sampleHalf || 7);
      return `<section class="panel"><div class="label">U${i + 1} · Light probe</div>
        <p class="hint">${photo.cornerFound && photo.cornerFound[i] === false
          ? "Couldn't find bare paper near this corner. Drag this pin onto paper if there is some."
          : 'This pin sits on bare paper near a corner. The four U pins check that the light is even.'}</p>
        ${s ? A.readout(C.rgbToLab(s.rgb), s.rgb) : A.readout(null)}</section>`;
    }
    const pin = selectedPin(photo);
    if (!pin) {
      return `<section class="panel"><div class="label">Pins</div>
        <p class="hint">Tap a pin to see its color. W is the paper. U1 to U4 check the light. Each of your pins can check a mix, hold a color you measured, or just show a color.</p>
        ${correction}${sampleSize(photo)}</section>`;
    }
    const pr = r.pins.find(x => x.pin.id === pin.id) || {};
    const roleOpts = Object.entries(ROLE_NAMES).map(([k, n]) => `<option value="${k}" ${pin.role === k ? 'selected' : ''}>${n}</option>`).join('');
    return `<section class="panel">
      <div class="label">Selected pin</div>
      <label class="field"><span>Name</span><input id="pinLabel" type="text" value="${A.esc(pin.label)}"></label>
      <label class="field"><span>What should this pin do?</span><select id="pinRole">${roleOpts}</select></label>
      <p class="hint">${ROLE_HELP[pin.role]}</p>
      <div class="chips">${A.chip(pr.rawRgb, 'raw')}<span class="muted">raw</span>${A.chip(pr.correctedRgb, 'corrected')}<span class="muted">corrected</span></div>
      ${A.readout(pr.correctedLab, pr.correctedRgb)}
      ${pin.role === 'known' ? knownHtml(pin) : ''}${pin.role === 'goal' ? goalHtml(pin, pr) : ''}${groupHtml(pin)}
      <div class="row" style="margin-top:8px"><button id="pinDelete">Delete pin</button></div>
    </section>${correction}`;
  }

  function labInputs(prefix, lab) {
    const lch = lab ? C.labToLch(lab) : [null, null, null];
    const v = x => (x === null || x === undefined ? '' : (+x).toFixed(1));
    return `<div class="label">L*C*h°</div><div class="row">
        <input type="number" step="0.1" data-k="${prefix}" data-f="lch0" value="${v(lch[0])}" aria-label="L*">
        <input type="number" step="0.1" data-k="${prefix}" data-f="lch1" value="${v(lch[1])}" aria-label="C*">
        <input type="number" step="1" data-k="${prefix}" data-f="lch2" value="${v(lch[2])}" aria-label="h°"></div>
      <div class="label" style="margin-top:6px">L*a*b*</div><div class="row">
        <input type="number" step="0.1" data-k="${prefix}" data-f="lab0" value="${v(lab && lab[0])}" aria-label="L*">
        <input type="number" step="0.1" data-k="${prefix}" data-f="lab1" value="${v(lab && lab[1])}" aria-label="a*">
        <input type="number" step="0.1" data-k="${prefix}" data-f="lab2" value="${v(lab && lab[2])}" aria-label="b*"></div>`;
  }

  function knownHtml(pin) {
    const set = D.paintSets[A.app.session.paintSet];
    const pick = set && set.hasTargets ? `<label class="field"><span>This is my…</span><select id="knownCode"><option value="">Typed in</option>
      ${Object.keys(D.chart).map(c => `<option value="${c}">${c} · ${A.esc(D.names[c])}</option>`).join('')}</select></label>` : '';
    const lab = pin.known && pin.known.lab;
    const oog = lab && !MF_calibrate.inGamut(lab) ? '<p class="hint">This color is more intense than a photo can record, so it is not used to correct the photo.</p>' : '';
    const r = A.result(), k = r && r.correction.perKnown.find(x => x.id === pin.id);
    const off = k && k.outlier ? '<p class="error-msg">This reading doesn\'t match the photo, so it is not used. Is the pin on the right swatch, and are the numbers right?</p>' : '';
    return `<div class="panel" style="background:var(--surface-alt)"><div class="label">Measured value</div>${off}
      <p class="hint">Enter the meter reading for this swatch. Measured colors make the correction more exact.</p>
      ${pick}${labInputs('known', lab)}${oog}</div>`;
  }

  function goalHtml(pin, pr) {
    const s = A.app.session, cls = D.classes[s.classId];
    const codes = cls.codes.length ? cls.codes : Object.keys(D.names);
    const code = pin.goal && pin.goal.code;
    const opts = codes.map(c => `<option value="${c}" ${c === code ? 'selected' : ''}>${c} · ${A.esc(D.names[c])}</option>`).join('');
    const fb = pr.feedback;
    return `<div class="panel" style="background:var(--surface-alt)"><div class="label">Goal</div>
      <label class="field"><span>Which color were you mixing?</span><select id="goalCode"><option value="">Custom target</option>${opts}</select></label>
      ${!code || (pin.goal && pin.goal.lab) ? labInputs('goal', pin.goal && pin.goal.lab) : ''}
      ${pr.target ? `<p class="muted">Target</p>${A.readout(pr.target)}` : ''}
      ${fb ? `<p class="verdict" style="font-size:1rem">${A.esc(fb.headline)}</p>${fb.detail.map(t => `<p class="muted">${A.esc(t)}</p>`).join('')}` : ''}</div>`;
  }

  function groupHtml(pin) {
    const cls = D.classes[A.app.session.classId];
    if (!cls.subModes) return '';
    const groups = [{ id: 'value', title: 'Value painting' }, ...cls.subModes];
    return `<label class="field"><span>Painting</span><select id="pinGroup">${groups.map(g => `<option value="${g.id}" ${pin.group === g.id ? 'selected' : ''}>${A.esc(g.title)}</option>`).join('')}</select></label>`;
  }

  function sampleSize(photo) {
    const cur = photo.sampleHalf || 7;
    return `<label class="field"><span>Sample size</span><select id="sampleHalf">${[3, 5, 7, 11, 15].map(h =>
      `<option value="${h}" ${h === cur ? 'selected' : ''}>${2 * h + 1} × ${2 * h + 1} px</option>`).join('')}</select></label>`;
  }

  function bind(panel) {
    const photo = A.activePhoto(), pin = selectedPin(photo);
    const q = id => panel.querySelector('#' + id);
    const done = () => { A.changed(); MF_canvas.refreshPanel(); MF_canvas.draw(); };
    if (q('sampleHalf')) q('sampleHalf').addEventListener('change', e => { photo.sampleHalf = Number(e.target.value); done(); });
    if (!pin) return;
    q('pinLabel').addEventListener('change', e => { pin.label = e.target.value || pin.label; done(); });
    q('pinRole').addEventListener('change', e => {
      const role = e.target.value;
      St.setRole(pin, role, role === 'goal' ? { code: A.app.session.subMode && D.names[A.app.session.subMode] ? A.app.session.subMode : null } : role === 'known' ? { lab: null } : undefined);
      done();
    });
    q('pinDelete').addEventListener('click', () => { St.deletePin(photo, pin.id); A.app.selected = null; done(); });
    if (q('pinGroup')) q('pinGroup').addEventListener('change', e => { pin.group = e.target.value; done(); });
    if (q('knownCode')) q('knownCode').addEventListener('change', e => {
      const c = e.target.value;
      if (c) { pin.known = { lab: D.chart[c].lab.slice(), code: c }; if (/^Pin \d+$/.test(pin.label)) pin.label = c; }
      done();
    });
    if (q('goalCode')) q('goalCode').addEventListener('change', e => {
      pin.goal = { code: e.target.value || null };
      if (e.target.value && /^Pin \d+$/.test(pin.label)) pin.label = e.target.value;
      done();
    });
    panel.querySelectorAll('input[data-k]').forEach(inp => inp.addEventListener('change', () => {
      const k = inp.dataset.k, f = inp.dataset.f;
      const vals = key => [0, 1, 2].map(i => parseFloat(panel.querySelector(`input[data-k="${k}"][data-f="${key}${i}"]`).value));
      let lab = f.startsWith('lch') ? vals('lch') : vals('lab');
      if (lab.some(x => !Number.isFinite(x))) return;
      if (f.startsWith('lch')) lab = C.lchToLab(lab);
      if (k === 'known') pin.known = { lab };
      else pin.goal = { ...(pin.goal || {}), lab };
      done();
    }));
  }

  return { html, bind };
})();

</script>
<script>
/* ---- ui_results.js ---- */
// Step 3: one verdict first, then swatch feedback, then details on request (spec §5, §9).
const MF_results = (() => {
  const A = MF_app, C = MF_color, D = MF_data, Ph = MF_phrases;
  const CHECK_NAMES = { paperPin: 'Paper pin', preEdited: 'Original photo', exposure: 'Exposure', warmth: 'Warmth',
    tint: 'Tint', evenness: 'Even light', focus: 'Focus' };
  const CORNER = ['Top left', 'Top right', 'Bottom right', 'Bottom left'];

  // Goal pins on the photo being viewed, grouped by goal code so 5.3 attempts at one swatch rank together.
  // Each photo has its own list (switch with the thumbnails); mixing photos listed every color twice.
  function goalRows(photo = A.activePhoto()) {
    const rows = [];
    const r = A.result(photo.id);
    if (r) for (const p of r.pins) if (p.pin.role === 'goal' && p.feedback) rows.push({ photo, p, miss: missOf(p) });
    const groups = new Map();
    for (const row of rows) {
      const key = row.p.code || row.p.pin.id;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(row);
    }
    return [...groups.values()];
  }
  const missOf = p => (p.judged && Number.isFinite(p.judged.worst) && p.judged.worst > 0 ? p.judged.worst : p.abs ? p.abs.de : Infinity);

  function html() {
    const photo = A.activePhoto(), r = A.result();
    if (!r) return '<section class="panel">Upload a photo first.</section>';
    const multi = A.app.session.photos.length > 1;
    const verdictClass = `level-${r.headline.level}`;
    // Follow-on photo advice is computed from the paper reading, so it waits until the paper reading is right.
    const fixes = r.trusted ? r.checks.filter(c => c.level !== 'ok' && c.id !== r.headline.checkId) : [];
    const groups = goalRows();
    const swatches = groups.length ? groups.map(rowsHtml).join('')
      : '<p class="hint">No pins are checking a mix yet. Go back to Pins, tap a pin, and set it to "Check my mix".</p>';
    return `
    ${multi ? `<div class="thumbs">${A.app.session.photos.map(p => `<button data-photo="${p.id}" class="${p.id === photo.id ? 'on' : ''}"><img alt="" src="${A.app.images[p.id].thumb}"></button>`).join('')}</div>` : ''}
    <section class="panel">
      <div class="label">Your photo${multi ? ` · ${A.esc(photo.name)}` : ''}</div>
      <p class="verdict ${verdictClass}">${A.esc(r.headline.text)}</p>
      ${fixes.length ? `<p class="muted">Also: ${fixes.map(c => A.esc(Ph.PHRASES[c.id][c.level](c.values))).join(' ')}</p>` : ''}
      <div class="preview"><canvas id="preview"></canvas></div>
      <p class="hint">Left is your photo. Right is the corrected version. Drag across the photo to move the line.</p>
      <div class="row">
        <button data-dl="corrected" class="primary">Save corrected photo</button>
        <button data-dl="record">Save record sheet</button>
        <button data-dl="csv">Save swatch numbers</button>
      </div>
      <p class="hint" id="dlmsg">On a phone, saving opens the share menu: choose Save Image for Photos, or Save to Files to pick a folder.</p>
      <p class="hint">The corrected photo shows what better looks like. Edit your own photo to match, then upload it again to check.</p>
    </section>
    <section class="panel"><div class="label">Your swatches${multi ? ` · ${A.esc(photo.name)}` : ''}</div>${swatches}
      ${multi ? '<p class="hint">Each photo has its own list. Tap a thumbnail at the top to see another photo.</p>' : ''}</section>
    ${detailsHtml(photo, r)}
    <div class="row"><button data-go="2">Back to pins</button><button data-go="1">Add another photo</button></div>`;
  }

  function rowsHtml(rows) {
    const ranked = rows.slice().sort((a, b) => a.miss - b.miss);
    const many = rows.length > 1;
    return ranked.map((row, i) => {
      const p = row.p, fb = p.feedback;
      const tags = [many && i === 0 && Number.isFinite(row.miss) ? '<span class="tag best">closest</span>' : '',
        p.neighborSource ? `<span class="tag">${p.neighborSource === 'own' ? 'compared with your own swatches' : p.neighborSource === 'chart' ? 'compared with the chart' : 'compared with yours and the chart'}</span>` : ''].join('');
      return `<div class="swatch-row">${A.chip(p.correctedRgb, p.pin.label)}
        <div class="text"><div class="head">${A.esc(p.pin.label)}${tags}</div>
        <div>${A.esc(fb.headline)}</div>${fb.detail.map(t => `<div class="muted">${A.esc(t)}</div>`).join('')}</div></div>`;
    }).join('');
  }

  function detailsHtml(photo, r) {
    const checks = r.checks.map(c => `<tr><td>${CHECK_NAMES[c.id]}</td><td class="level-${c.level}">${c.level === 'ok' ? 'ok' : c.level === 'little' ? 'a little off' : 'off'}</td>
      <td>${A.esc(Ph.PHRASES[c.id][c.level](c.values))}</td><td class="n">${numbers(c)}</td></tr>`).join('');
    const im = A.app.images[photo.id].img;
    const corners = photo.corners.map((c, i) => {
      const s = MF_sampler.samplePatch(im, c.x * im.width, c.y * im.height, photo.sampleHalf || 7);
      const lab = s && C.rgbToLab(s.rgb);
      return `<div>${CORNER[i]}<br>${lab ? `L*${lab[0].toFixed(1)} b*${lab[2].toFixed(1)}` : 'off photo'}</div>`;
    });
    const corr = r.correction;
    const knowns = corr.perKnown.map(k => {
      const pin = photo.pins.find(p => p.id === k.id);
      return `<tr><td>${A.esc(pin ? pin.label : k.id)}</td><td class="n">${k.de.toFixed(1)}</td><td>${k.outOfGamut ? 'too intense for a photo, not used' : k.outlier ? "doesn't match the photo, not used. Check the pin's spot and numbers." : 'used'}</td></tr>`;
    }).join('');
    const pinRows = r.pins.map(p => {
      const lch = p.correctedLab ? C.labToLch(p.correctedLab) : null;
      return `<tr><td>${A.chip(p.correctedRgb)}</td><td>${A.esc(p.pin.label)}</td><td>${{ goal: 'check mix', known: 'measured', look: 'show color' }[p.pin.role] || p.pin.role}</td>
        <td class="n">${lch ? `${lch[0].toFixed(1)} ${lch[1].toFixed(1)} ${lch[2].toFixed(0)}°` : 'off photo'}</td><td class="n">${p.hex || ''}</td>
        <td class="n">${p.judged && Number.isFinite(p.judged.gap) ? p.judged.gap.toFixed(1) : ''}</td>
        <td class="n">${p.judged && Number.isFinite(p.judged.lean) ? p.judged.lean.toFixed(1) : ''}</td></tr>`;
    }).join('');
    return `
    <details class="more"><summary>Photo checks</summary><div class="body scroll-x"><table class="data">
      <tr><th>Check</th><th>Result</th><th>What to do</th><th>Numbers</th></tr>${checks}</table>
      <p class="hint">Numbers compare your photo's paper with the measured class paper. The thresholds are still being tuned.</p></div></details>
    <details class="more"><summary>Light across the page</summary><div class="body"><div class="corner-map">${corners.join('')}</div>
      <p class="hint">Even light gives similar numbers in all four corners.</p></div></details>
    <details class="more"><summary>How the photo was corrected</summary><div class="body">
      <p>${corr.method === 'matrix' ? 'Paper plus known colors (full color fit).' : 'Paper only (white balance).'} Photo error about <span class="num">${corr.error.toFixed(1)} ΔE00</span>.</p>
      ${knowns ? `<div class="scroll-x"><table class="data"><tr><th>Color you measured</th><th>Left over ΔE00</th><th></th></tr>${knowns}</table></div>` : '<p class="hint">Set pins on swatches you measured to "Color I measured", or place a calibration card, to make this more exact.</p>'}
      <p class="hint">Photo feedback never gives a star. Only the meter can do that.</p></div></details>
    <details class="more"><summary>All pins</summary><div class="body scroll-x"><table class="data">
      <tr><th></th><th>Pin</th><th>Role</th><th>L*C*h°</th><th>Hex</th><th>Gap</th><th>Lean</th></tr>${pinRows}</table></div></details>
    <details class="more"><summary>Class summary</summary><div class="body">${classSummary()}</div></details>`;
  }

  function numbers(c) {
    const v = c.values || {}, f = x => (x > 0 ? '+' : '') + x.toFixed(1);
    if (c.id === 'exposure') return `ΔL* ${f(v.dL)}`;
    if (c.id === 'warmth') return `Δb* ${f(v.db)}`;
    if (c.id === 'tint') return `Δa* ${f(v.da)}`;
    if (c.id === 'evenness' && Number.isFinite(v.rangeL)) return `L* range ${v.rangeL.toFixed(1)}, b* range ${v.rangeB.toFixed(1)}`;
    if (c.id === 'focus') return `${Math.round(v.focus)}`;
    if (c.id === 'paperPin' || c.id === 'preEdited') return Number.isFinite(v.L) ? `L* ${v.L.toFixed(1)} C* ${v.C.toFixed(1)}` : '';
    return '';
  }

  function allPins() {
    const out = [];
    for (const photo of A.app.session.photos) { const r = A.result(photo.id); if (r) out.push(...r.pins.filter(p => p.correctedLab)); }
    return out;
  }

  function classSummary() {
    const id = A.app.session.classId, pins = allPins(), lch = p => C.labToLch(p.correctedLab);
    if (id === '2.3' || id === '4.3' || id === '5.3') {
      const rows = pins.filter(p => p.judged && (Number.isFinite(p.judged.gap) || Number.isFinite(p.judged.chromaN)));
      if (!rows.length) return '<p class="hint">Add goal pins with colors from this class to see the summary.</p>';
      return `<div class="scroll-x"><table class="data"><tr><th>Pin</th><th>Gap</th><th>Lean</th><th>Chroma</th></tr>${rows.map(p => `<tr><td>${A.esc(p.pin.label)}</td>
        <td class="n">${Number.isFinite(p.judged.gap) ? p.judged.gap.toFixed(1) : ''}</td><td class="n">${Number.isFinite(p.judged.lean) ? p.judged.lean.toFixed(1) : ''}</td>
        <td class="n">${Number.isFinite(p.judged.chromaN) ? p.judged.chromaN.toFixed(1) : ''}</td></tr>`).join('')}</table></div>
        <p class="hint">Gap near 0 means the mix sits halfway between its neighbors. From a photo these are directions, not grades.</p>`;
    }
    if (id === '3.3') {
      const steps = pins.slice().sort((a, b) => lch(b)[0] - lch(a)[0]);
      if (!steps.length) return '<p class="hint">Put a pin on each of your five value steps.</p>';
      return `<p class="hint">${A.esc(D.classes['3.3'].note)} For now: your steps from light to dark, with the jump between each.</p>
        <table class="data"><tr><th>Step</th><th>L*</th><th>Jump</th></tr>${steps.map((p, i) => `<tr><td>${A.esc(p.pin.label)}</td>
        <td class="n">${lch(p)[0].toFixed(1)}</td><td class="n">${i ? (lch(steps[i - 1])[0] - lch(p)[0]).toFixed(1) : ''}</td></tr>`).join('')}</table>`;
    }
    if (id === '6.3') {
      const groups = [{ id: 'value', title: 'Value painting', prop: 0, name: 'L* range' }, { id: 'saturation', title: 'Saturation', prop: 1, name: 'C* range' },
        { id: 'comp-neutral', title: 'Complements through neutral', prop: 1, name: 'C* range' }, { id: 'comp-hue', title: 'Complements around the hue circle', prop: 2, name: 'hue span' }];
      const rows = groups.map(g => {
        const v = pins.filter(p => (p.pin.group || 'value') === g.id).map(p => lch(p)[g.prop]);
        return `<tr><td>${g.title}</td><td>${g.name}</td><td class="n">${v.length > 1 ? (Math.max(...v) - Math.min(...v)).toFixed(1) : '·'}</td><td class="n">${v.length}</td></tr>`;
      }).join('');
      return `<p class="hint">Each painting should carry about as much contrast as your value painting, in its own property. Pins can come from any photo. Set each pin's painting in the Pins step.</p>
        <table class="data"><tr><th>Painting</th><th>Measure</th><th>Spread</th><th>Pins</th></tr>${rows}</table>`;
    }
    return '';
  }

  function drawPreview(root) {
    const canvas = root.querySelector('#preview'), im = A.app.images[A.app.session.activePhoto], corr = A.correctedCanvas();
    if (!canvas || !im || !corr) return;
    const w = Math.min(root.querySelector('.preview').clientWidth || 600, 900), h = w * im.img.height / im.img.width, dpr = window.devicePixelRatio || 1;
    canvas.style.width = `${w}px`; canvas.style.height = `${h}px`;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    const ctx = canvas.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const s = A.app.view.split;
    ctx.drawImage(im.canvas, 0, 0, w, h);
    ctx.drawImage(corr, s * im.img.width, 0, (1 - s) * im.img.width, im.img.height, s * w, 0, (1 - s) * w, h);
    ctx.fillStyle = '#fff'; ctx.fillRect(s * w - 1, 0, 2, h);
  }

  function bind(root) {
    root.querySelectorAll('[data-photo]').forEach(b => b.addEventListener('click', () => { A.app.session.activePhoto = b.dataset.photo; A.render(); }));
    root.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => A.go(Number(b.dataset.go))));
    root.querySelectorAll('[data-dl]').forEach(b => b.addEventListener('click', () => MF_export.download(b.dataset.dl)));
    const canvas = root.querySelector('#preview');
    if (canvas) {
      let dragging = false;
      const set = e => { const r = canvas.getBoundingClientRect(); A.app.view.split = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); drawPreview(root); };
      canvas.addEventListener('pointerdown', e => { dragging = true; set(e); });
      canvas.addEventListener('pointermove', e => { if (dragging) set(e); });
      window.addEventListener('pointerup', () => { dragging = false; });
    }
    drawPreview(root);
    // Build the images now so the share menu can open the moment a save button is tapped.
    setTimeout(() => MF_export.prepare(), 50);
    root.querySelectorAll('details.more').forEach(d => d.addEventListener('toggle', A.postHeight));
  }

  return { html, bind, goalRows, missOf };
})();

</script>
<script>
/* ---- ui_export.js ---- */
// Downloads (spec §11): corrected photo, record sheet (photo + pins + feedback), swatch CSV.
const MF_export = (() => {
  const A = MF_app, C = MF_color, St = MF_state;

  const toBlob = canvas => new Promise(res => canvas.toBlob(res, 'image/png'));

  async function correctedBlob(photoId = A.app.session.activePhoto) {
    const c = A.correctedCanvas(photoId);
    return c ? toBlob(c) : null;
  }

  function wrap(ctx, text, x, y, maxW, lh) {
    const words = String(text).split(' ');
    let line = '';
    for (const w of words) {
      const t = line ? line + ' ' + w : w;
      if (ctx.measureText(t).width > maxW && line) { ctx.fillText(line, x, y); y += lh; line = w; } else line = t;
    }
    if (line) { ctx.fillText(line, x, y); y += lh; }
    return y;
  }

  async function recordSheetBlob(photoId = A.app.session.activePhoto) {
    const photo = St.getPhoto(A.app.session, photoId), im = A.app.images[photoId], r = A.result(photoId);
    if (!photo || !im || !r) return null;
    const W = 1600, scale = Math.min(1, 1000 / im.img.width), pw = im.img.width * scale, ph = im.img.height * scale;
    const panelX = pw + 40, panelW = W - panelX - 30;
    const rows = r.pins.filter(p => p.pin.role === 'goal' && p.feedback);
    const H = Math.max(ph + 60, 260 + rows.length * 90);
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#f4f6f9'; ctx.fillRect(0, 0, W, H);
    ctx.drawImage(im.canvas, 20, 30, pw, ph);
    const mark = (p, t, sq) => {
      const x = 20 + p.x * pw, y = 30 + p.y * ph;
      ctx.lineWidth = 2; ctx.strokeStyle = '#222'; ctx.fillStyle = sq ? '#fff' : '#222';
      ctx.beginPath(); if (sq) ctx.rect(x - 8, y - 8, 16, 16); else ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.font = '400 16px Jost, sans-serif';
      const tw = ctx.measureText(t).width;
      ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fillRect(x + 11, y - 12, tw + 8, 22);
      ctx.fillStyle = '#222'; ctx.fillText(t, x + 15, y + 5);
    };
    for (const p of photo.pins) mark(p, p.label, false);
    mark(photo.paperPin, 'W', true);
    ctx.fillStyle = '#222';
    ctx.font = '400 24px Jost, sans-serif';
    let y = 60;
    y = wrap(ctx, St.filenameBase(A.app.session), panelX, y, panelW, 30);
    ctx.font = '300 16px Jost, sans-serif'; ctx.fillStyle = '#666';
    y = wrap(ctx, `${photo.name} · ${new Date().toLocaleDateString()}`, panelX, y, panelW, 22) + 10;
    ctx.fillStyle = '#222'; ctx.font = '400 20px Jost, sans-serif';
    y = wrap(ctx, r.headline.text, panelX, y, panelW, 26) + 16;
    for (const p of rows) {
      ctx.fillStyle = p.hex || '#fff'; ctx.fillRect(panelX, y - 18, 28, 28); ctx.strokeStyle = '#e0e3e8'; ctx.strokeRect(panelX, y - 18, 28, 28);
      ctx.fillStyle = '#222'; ctx.font = '400 17px Jost, sans-serif';
      y = wrap(ctx, p.pin.label, panelX + 40, y, panelW - 40, 22);
      ctx.font = '300 16px Jost, sans-serif';
      y = wrap(ctx, [p.feedback.headline, ...p.feedback.detail].join(' '), panelX + 40, y, panelW - 40, 21) + 12;
    }
    ctx.fillStyle = '#666'; ctx.font = '300 14px Jost, sans-serif';
    wrap(ctx, `Photo error about ${r.correction.error.toFixed(1)} ΔE00. Photo feedback gives directions, not grades.`, panelX, H - 30, panelW, 18);
    return toBlob(c);
  }

  const csvCell = v => {
    const s = v === null || v === undefined ? '' : String(v);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const lchStr = lab => (lab ? C.labToLch(lab).map((v, i) => v.toFixed(i === 2 ? 0 : 1)).join(' ') : '');

  function csv(session = A.app.session) {
    const head = ['photo', 'pin', 'role', 'raw L*C*h', 'corrected L*C*h', 'corrected L*a*b*', 'hex', 'target code',
      'target L*C*h', 'gap', 'lean', 'feedback'];
    const lines = [head.join(',')];
    for (const photo of session.photos) {
      const r = A.result(photo.id);
      if (!r) continue;
      for (const p of r.pins) {
        lines.push([photo.name, p.pin.label, p.pin.role, lchStr(p.rawLab), lchStr(p.correctedLab),
          p.correctedLab ? p.correctedLab.map(v => v.toFixed(2)).join(' ') : '', p.hex, p.code, lchStr(p.target),
          p.judged && Number.isFinite(p.judged.gap) ? p.judged.gap.toFixed(2) : '',
          p.judged && Number.isFinite(p.judged.lean) ? p.judged.lean.toFixed(2) : '',
          p.feedback ? [p.feedback.headline, ...p.feedback.detail].join(' ') : ''].map(csvCell).join(','));
      }
    }
    return lines.join('\n') + '\n';
  }

  function save(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  // Images are built ahead of time: iOS only opens the share sheet right after a tap, and building a
  // 2000 px PNG can take longer than that allows. Keyed by the analysis result, so any pin change rebuilds.
  const ready = new Map(); // photoId -> { result, corrected: Promise<Blob>, record: Promise<Blob> }
  function prepare(photoId = A.app.session.activePhoto) {
    const r = A.result(photoId), c = ready.get(photoId);
    if (c && c.result === r) return c;
    const entry = { result: r, corrected: correctedBlob(photoId), record: recordSheetBlob(photoId) };
    ready.set(photoId, entry);
    return entry;
  }

  // Phone: share sheet (Save Image, Save to Files, AirDrop…). Chrome/Edge desktop: a Save As dialog.
  // Otherwise (or if either is blocked, e.g. inside an iframe without permission): a normal download.
  async function deliver(blob, name) {
    const file = new File([blob], name, { type: blob.type });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return 'shared'; }
    } catch (e) { if (e.name === 'AbortError') return 'cancelled'; }
    try {
      if (window.showSaveFilePicker) {
        const ext = name.split('.').pop();
        const handle = await window.showSaveFilePicker({ suggestedName: name,
          types: [{ description: ext.toUpperCase(), accept: { [blob.type]: ['.' + ext] } }] });
        const w = await handle.createWritable(); await w.write(blob); await w.close();
        return 'saved';
      }
    } catch (e) { if (e.name === 'AbortError') return 'cancelled'; }
    save(blob, name);
    return 'downloaded';
  }

  async function download(kind) {
    const base = St.filenameBase(A.app.session);
    let blob, name;
    if (kind === 'csv') { blob = new Blob([csv()], { type: 'text/csv' }); name = `${base}_swatches.csv`; }
    else { blob = await prepare()[kind]; name = `${base}_${kind}.png`; }
    if (!blob) return null;
    const how = await deliver(blob, name);
    const msg = document.getElementById('dlmsg');
    if (msg) msg.textContent = how === 'downloaded'
      ? `Saved ${name}. On iPhone it is in the Files app, in Downloads. On a computer, check your Downloads folder.`
      : '';
    return how;
  }

  return { correctedBlob, recordSheetBlob, csv, download, prepare };
})();

</script>
<script>
/* ---- ui_main.js ---- */
// Start the app once the page is ready.
(function start() {
  const go = () => MF_app.render();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  // Only a width change needs new layout. Height changes happen all the time inside the iframe (the parent
  // resizes it to fit) and on phones (the address bar hides), and re-rendering on those closed every section.
  let t, lastW = window.innerWidth;
  window.addEventListener('resize', () => {
    if (window.innerWidth === lastW) return;
    lastW = window.innerWidth;
    clearTimeout(t);
    t = setTimeout(() => { if (MF_app.app.step === 2) MF_canvas.draw(); else MF_app.render(); }, 150);
  });
})();

</script>
</body>
